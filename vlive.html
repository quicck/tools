<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VTuber ライブ配信スケジュール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Material 3 Expressive トークン定義 */
    :root {
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-on-primary-container: #21005D;
      --md-sys-color-secondary: #625B71;
      --md-sys-color-secondary-container: #E8DEF8;
      --md-sys-color-on-secondary-container: #1D192B;
      --md-sys-color-tertiary: #7D5260;
      --md-sys-color-tertiary-container: #FFD8E4;
      --md-sys-color-on-tertiary-container: #31111D;
      --md-sys-color-surface: #FEF7FF;
      --md-sys-color-surface-container-low: #F7F2FA;
      --md-sys-color-surface-container: #F3EDF7;
      --md-sys-color-surface-container-high: #ECE6F0;
      --md-sys-color-surface-container-highest: #E6E0E9;
      --md-sys-color-on-surface: #1D1B20;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-outline-variant: #CAC4D0;

      /* Expressive スプリングイージング */
      --md-motion-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --md-motion-emphasized: cubic-bezier(0.2, 0, 0, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --md-sys-color-primary: #D0BCFF;
        --md-sys-color-on-primary: #381E72;
        --md-sys-color-primary-container: #4F378B;
        --md-sys-color-on-primary-container: #EADDFF;
        --md-sys-color-secondary: #CCC2DC;
        --md-sys-color-secondary-container: #4A4458;
        --md-sys-color-on-secondary-container: #E8DEF8;
        --md-sys-color-tertiary: #EFB8C8;
        --md-sys-color-tertiary-container: #633B48;
        --md-sys-color-on-tertiary-container: #FFD8E4;
        --md-sys-color-surface: #141218;
        --md-sys-color-surface-container-low: #1D1B20;
        --md-sys-color-surface-container: #211F26;
        --md-sys-color-surface-container-high: #2B2930;
        --md-sys-color-surface-container-highest: #36343B;
        --md-sys-color-on-surface: #E6E0E9;
        --md-sys-color-on-surface-variant: #CAC4D0;
        --md-sys-color-outline-variant: #49454F;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      font-family: 'Noto Sans JP', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-display {
      font-family: 'M PLUS Rounded 1c', sans-serif;
    }

    /* 背景の有機的なアンビエントシェイプ（一番外側の枠ではなく背景装飾） */
    .ambient-blob {
      position: fixed;
      border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
      filter: blur(80px);
      opacity: 0.35;
      z-index: -1;
      pointer-events: none;
      animation: morphBlob 18s ease-in-out infinite alternate;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: var(--md-sys-color-primary-container);
    }

    .blob-2 {
      bottom: -15%;
      right: -10%;
      width: 55vw;
      height: 55vw;
      background: var(--md-sys-color-tertiary-container);
      animation-delay: -9s;
    }

    @keyframes morphBlob {
      0% {
        border-radius: 42% 58% 70% 30% / 45% 45% 55% 55%;
        transform: translate(0, 0) rotate(0deg) scale(1);
      }
      50% {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        transform: translate(3%, 4%) rotate(15deg) scale(1.06);
      }
      100% {
        border-radius: 30% 70% 55% 45% / 40% 60% 40% 60%;
        transform: translate(-2%, 2%) rotate(-10deg) scale(0.96);
      }
    }

    /* Expressive チップ・ボタンのインタラクション */
    .m3-chip {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      border-radius: 9999px;
      transition: 
        transform 0.35s var(--md-motion-spring),
        background-color 0.25s var(--md-motion-emphasized),
        color 0.25s var(--md-motion-emphasized),
        border-radius 0.3s var(--md-motion-spring);
      cursor: pointer;
      user-select: none;
    }

    .m3-chip:hover {
      transform: translateY(-2px) scale(1.03);
      border-radius: 16px;
    }

    .m3-chip:active {
      transform: scale(0.95);
    }

    .m3-chip.active {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(103, 80, 164, 0.25);
    }

    /* スケジュールアイテム（外枠なしのリスト空間に独立して配置されるExpressiveサーフェス） */
    .schedule-item {
      background-color: var(--md-sys-color-surface-container-low);
      border-radius: 28px;
      transition: 
        transform 0.45s var(--md-motion-spring),
        background-color 0.3s var(--md-motion-emphasized),
        border-radius 0.35s var(--md-motion-spring),
        box-shadow 0.35s var(--md-motion-emphasized);
      position: relative;
      overflow: hidden;
    }

    .schedule-item:hover {
      background-color: var(--md-sys-color-surface-container-high);
      transform: translateY(-3px) scale(1.008);
      border-radius: 20px;
      box-shadow: 0 10px 24px -6px rgba(0, 0, 0, 0.08);
    }

    .schedule-item:active {
      transform: scale(0.99);
    }

    /* 注目（hot）アイテムのExpressiveなアクセント */
    .schedule-item.is-hot {
      background-color: var(--md-sys-color-surface-container);
    }

    .schedule-item.is-hot::before {
      content: '';
      position: absolute;
      left: 0;
      top: 18%;
      bottom: 18%;
      width: 5px;
      border-radius: 0 8px 8px 0;
      background: linear-gradient(180deg, var(--md-sys-color-primary), var(--md-sys-color-tertiary));
      transition: top 0.3s var(--md-motion-spring), bottom 0.3s var(--md-motion-spring);
    }

    .schedule-item.is-hot:hover::before {
      top: 10%;
      bottom: 10%;
    }

    /* 新規追加時のアニメーション（既存要素は点滅させない） */
    @keyframes expressiveEnter {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-enter {
      animation: expressiveEnter 0.55s var(--md-motion-spring) forwards;
    }

    /* 日付ピル */
    .date-pill {
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.35s var(--md-motion-spring), border-radius 0.35s var(--md-motion-spring);
    }

    .date-pill:hover {
      transform: scale(1.04);
      border-radius: 9999px;
    }

    /* 時間バッジ */
    .time-badge {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-radius: 18px;
      transition: border-radius 0.3s var(--md-motion-spring), transform 0.3s var(--md-motion-spring);
    }

    .schedule-item:hover .time-badge {
      border-radius: 9999px;
      transform: scale(1.04);
    }

    /* 注目バッジ */
    .hot-badge {
      background-color: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      border-radius: 9999px;
      animation: subtlePulse 3s ease-in-out infinite;
    }

    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* 検索ボックス */
    .m3-search {
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
      border-radius: 9999px;
      transition: 
        box-shadow 0.3s var(--md-motion-emphasized),
        background-color 0.3s var(--md-motion-emphasized),
        transform 0.35s var(--md-motion-spring);
    }

    .m3-search:focus-within {
      background-color: var(--md-sys-color-surface-container-low);
      box-shadow: 0 0 0 2px var(--md-sys-color-primary);
      transform: scale(1.01);
    }

    /* スクロールバー非表示（横スクロールフィルター用） */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ローディング用の有機的なシェイプ */
    .loader-shape {
      width: 48px;
      height: 48px;
      background-color: var(--md-sys-color-primary);
      animation: shapeSpin 2.4s var(--md-motion-spring) infinite;
    }

    @keyframes shapeSpin {
      0% { border-radius: 50%; transform: rotate(0deg) scale(0.85); }
      25% { border-radius: 28%; transform: rotate(90deg) scale(1.05); }
      50% { border-radius: 50% 20% 50% 20%; transform: rotate(180deg) scale(0.9); }
      75% { border-radius: 24%; transform: rotate(270deg) scale(1.05); }
      100% { border-radius: 50%; transform: rotate(360deg) scale(0.85); }
    }

    /* スクロール追従時のコントロールバー背景とトランジション */
    .sticky-controls-bar {
      background-color: color-mix(in srgb, var(--md-sys-color-surface) 84%, transparent);
      transition: box-shadow 0.3s var(--md-motion-emphasized), background-color 0.3s var(--md-motion-emphasized);
    }

    .sticky-controls-bar.is-stuck {
      box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.12);
    }

    /* 右下トップへ戻るボタン (Material 3 Expressive FAB) */
    .scroll-top-fab {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-radius: 22px;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.2);
      transition:
        opacity 0.3s var(--md-motion-emphasized),
        transform 0.45s var(--md-motion-spring),
        border-radius 0.35s var(--md-motion-spring),
        background-color 0.25s var(--md-motion-emphasized),
        color 0.25s var(--md-motion-emphasized);
    }

    .scroll-top-fab.is-hidden {
      opacity: 0;
      transform: translateY(24px) scale(0.8);
      pointer-events: none;
    }

    .scroll-top-fab:not(.is-hidden):hover {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 9999px;
      transform: translateY(-4px) scale(1.06);
    }

    .scroll-top-fab:not(.is-hidden):active {
      transform: scale(0.93);
    }
  </style>
</head>
<body class="antialiased selection:bg-purple-300 selection:text-purple-950">

  <!-- 背景の有機的な装飾 -->
  <div class="ambient-blob blob-1"></div>
  <div class="ambient-blob blob-2"></div>

  <!-- メインコンテンツ（外側のカード囲み枠は一切なし） -->
  <main class="max-w-5xl mx-auto px-4 sm:px-6 md:px-8 pt-6 sm:pt-10 pb-24">
    
    <!-- タイトルエリア -->
    <div class="mb-4 sm:mb-6">
      <h1 class="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold tracking-tight flex items-center gap-3">
        <span class="material-symbols-rounded text-4xl sm:text-5xl" style="color: var(--md-sys-color-primary);">schedule</span>
        <span>ライブ配信スケジュール</span>
      </h1>
    </div>

    <!-- スクロール時も上部に追従して残る検索枠＆フィルターエリア -->
    <div id="stickyControls" class="sticky-controls-bar sticky top-0 z-30 -mx-4 sm:-mx-6 md:-mx-8 px-4 sm:px-6 md:px-8 pt-3 pb-3.5 mb-5 sm:mb-7 backdrop-blur-xl">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
        
        <!-- 日付タブ & 注目フィルター -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5 order-2 md:order-1">
          <div id="dateTabsContainer" class="flex items-center gap-2">
            <button class="m3-chip active px-4 py-2 text-sm font-bold whitespace-nowrap" data-date="ALL">すべての日程</button>
          </div>
          <button id="hotFilterBtn" class="m3-chip px-4 py-2 text-sm font-bold flex items-center gap-1.5 whitespace-nowrap shrink-0">
            <span class="material-symbols-rounded text-lg">local_fire_department</span>
            <span>注目のみ</span>
          </button>
        </div>

        <!-- 検索バー（スクロールしても常に上部に残る） -->
        <div class="m3-search flex items-center px-4 py-2 w-full md:w-72 lg:w-80 shrink-0 order-1 md:order-2 shadow-sm">
          <span class="material-symbols-rounded mr-2 text-xl" style="color: var(--md-sys-color-on-surface-variant);">search</span>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="配信者・タイトルで絞り込み" 
            class="bg-transparent border-none outline-none w-full text-sm sm:text-base placeholder-current opacity-80 focus:opacity-100"
          >
          <button id="clearSearchBtn" class="hidden ml-1 p-1 rounded-full hover:bg-black/10 dark:hover:bg-white/10 transition-transform active:scale-90" aria-label="クリア">
            <span class="material-symbols-rounded text-lg block">close</span>
          </button>
        </div>

      </div>
    </div>

    <!-- 初期読み込みインジケーター（データ取得完了後に自動で消去） -->
    <div id="initialLoader" class="flex flex-col items-center justify-center py-24">
      <div class="loader-shape"></div>
    </div>

    <!-- スケジュール一覧コンテナ（外枠なし・フラットな空間に直接アイテムを配置） -->
    <div id="scheduleContainer" class="space-y-8"></div>

    <!-- 検索結果ゼロ時の表示 -->
    <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
      <span class="material-symbols-rounded text-6xl mb-3 opacity-40">event_busy</span>
      <p class="font-display text-lg font-bold opacity-70">該当する配信予定が見つかりません</p>
    </div>

  </main>

  <!-- 右下のトップへ戻るボタン -->
  <button 
    id="scrollTopBtn" 
    class="scroll-top-fab is-hidden fixed bottom-6 right-5 sm:bottom-8 sm:right-8 z-40 w-14 h-14 flex items-center justify-center cursor-pointer"
    aria-label="ページのトップへ戻る"
    title="トップへ戻る"
  >
    <span class="material-symbols-rounded text-2xl sm:text-3xl">arrow_upward</span>
  </button>

  <script>
    (function() {
      const TARGET_URL = 'https://r.jina.ai/https://virtual-youtuber.userlocal.jp/schedules';
      const BASE_ORIGIN = 'https://virtual-youtuber.userlocal.jp';

      // アプリケーション状態
      let allSchedules = [];
      let selectedDate = 'ALL';
      let onlyHot = false;
      let searchQuery = '';
      let latestSequenceId = 0; // 非同期レスポンスの順序逆転防止用

      // DOM要素
      const scheduleContainer = document.getElementById('scheduleContainer');
      const dateTabsContainer = document.getElementById('dateTabsContainer');
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      const hotFilterBtn = document.getElementById('hotFilterBtn');
      const initialLoader = document.getElementById('initialLoader');
      const emptyState = document.getElementById('emptyState');
      const stickyControls = document.getElementById('stickyControls');
      const scrollTopBtn = document.getElementById('scrollTopBtn');

      // 相対URLを絶対URLに変換
      function resolveUrl(url) {
        if (!url) return '';
        if (url.startsWith('http://') || url.startsWith('https://')) return url;
        if (url.startsWith('//')) return 'https:' + url;
        return BASE_ORIGIN + (url.startsWith('/') ? '' : '/') + url;
      }

      // 取得したHTML文字列からスケジュールデータを抽出
      function parseScheduleHtml(htmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const rows = doc.querySelectorAll('table.table-live-schedules tr');

        if (!rows || rows.length === 0) return null;

        const parsed = [];
        let currentDate = '';
        let currentHour = '';
        let currentMinute = '00';

        rows.forEach((tr) => {
          // 日付ヘッダー行 (例: 13日(金))
          if (tr.classList.contains('row-header')) {
            const td = tr.querySelector('td');
            if (td) {
              currentDate = td.textContent.trim();
              currentHour = '';
              currentMinute = '00';
            }
            return;
          }

          // コンテンツ行
          if (tr.classList.contains('row-content')) {
            const timeTd = tr.querySelector('td.col-time');
            const titleTd = tr.querySelector('td.col-title');
            if (!titleTd) return;

            // 時間の引き継ぎと更新ロジック
            if (timeTd) {
              const hourDiv = timeTd.querySelector('.hour');
              if (hourDiv) {
                currentHour = hourDiv.textContent.trim();
                // .hour の次の div に分が入る場合がある (例: <div>14時</div><div>30分</div>)
                const divs = timeTd.querySelectorAll('div');
                if (divs.length > 1) {
                  const minText = divs[1].textContent.trim().replace('分', '').trim();
                  currentMinute = minText ? minText.padStart(2, '0') : '00';
                } else {
                  currentMinute = '00';
                }
              } else {
                // .hour がない場合、テキストに直接「30分」などと書かれているか空欄
                const rawTimeText = timeTd.textContent.trim();
                if (rawTimeText.includes('分')) {
                  const minNum = rawTimeText.replace('分', '').trim();
                  currentMinute = minNum ? minNum.padStart(2, '0') : '00';
                }
              }
            }

            // 注目フラグ
            const isHot = titleTd.classList.contains('hot');

            // アイコン画像（事務所またはプラットフォーム）
            const imgEl = titleTd.querySelector('img');
            const iconUrl = imgEl ? resolveUrl(imgEl.getAttribute('src')) : '';

            // 配信者名とチャンネルページURL
            const streamerSpan = titleTd.querySelector('span.link-dark a');
            const streamerName = streamerSpan ? streamerSpan.textContent.trim() : '';
            const streamerUrl = streamerSpan ? resolveUrl(streamerSpan.getAttribute('href')) : '';

            // 配信タイトルとスケジュールリンク（span.link-dark の外側にある直接の a タグ）
            let streamTitle = '';
            let streamUrl = '';
            const directLinks = Array.from(titleTd.children).filter(el => el.tagName === 'A');
            if (directLinks.length > 0) {
              const mainLink = directLinks[directLinks.length - 1];
              streamTitle = mainLink.textContent.trim();
              streamUrl = resolveUrl(mainLink.getAttribute('href'));
            }

            if (!streamTitle && !streamerName) return;

            // 一意キーの生成（差分更新で点滅を防ぐため）
            const uniqueKey = `${currentDate}_${currentHour}_${currentMinute}_${streamUrl || streamTitle}_${streamerName}`;

            // 時刻表示整形 (例: 18:00)
            const hourNum = currentHour.replace('時', '').trim().padStart(2, '0');
            const displayTime = hourNum ? `${hourNum}:${currentMinute}` : '--:--';

            parsed.push({
              key: uniqueKey,
              date: currentDate || '日程未定',
              time: displayTime,
              isHot,
              iconUrl,
              streamerName,
              streamerUrl,
              streamTitle,
              streamUrl
            });
          }
        });

        return parsed.length > 0 ? parsed : null;
      }

      // 日付タブの差分更新（既存のタブは再生成せず、変更時のみ滑らかに反映）
      function syncDateTabs(dates) {
        const existingButtons = Array.from(dateTabsContainer.querySelectorAll('button[data-date]'));
        const existingDates = existingButtons.map(b => b.getAttribute('data-date'));
        const targetDates = ['ALL', ...dates];

        // 選択中の日付が消えた場合はALLに戻す
        if (!targetDates.includes(selectedDate)) {
          selectedDate = 'ALL';
        }

        // 配列が完全一致していればDOM操作をスキップ
        if (existingDates.length === targetDates.length && existingDates.every((v, i) => v === targetDates[i])) {
          existingButtons.forEach(btn => {
            if (btn.getAttribute('data-date') === selectedDate) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
          return;
        }

        // 差分がある場合は再構築
        dateTabsContainer.innerHTML = '';
        targetDates.forEach(dateVal => {
          const btn = document.createElement('button');
          btn.className = `m3-chip px-4 py-2 text-sm font-bold whitespace-nowrap ${dateVal === selectedDate ? 'active' : ''}`;
          btn.setAttribute('data-date', dateVal);
          btn.textContent = dateVal === 'ALL' ? 'すべての日程' : dateVal;
          btn.addEventListener('click', () => {
            selectedDate = dateVal;
            syncDateTabs(dates);
            renderSchedules();
          });
          dateTabsContainer.appendChild(btn);
        });
      }

      // スケジュール要素のDOM生成
      function createScheduleCardElement(item, isNew) {
        const article = document.createElement('article');
        article.className = `schedule-item p-4 sm:p-5 flex items-start sm:items-center gap-3.5 sm:gap-5 ${item.isHot ? 'is-hot' : ''} ${isNew ? 'animate-enter' : ''}`;
        article.setAttribute('data-key', item.key);

        // 時刻バッジ
        const timeBox = document.createElement('div');
        timeBox.className = 'time-badge font-display font-extrabold text-sm sm:text-base px-3 py-2 sm:px-3.5 sm:py-2.5 shrink-0 text-center min-w-[68px] sm:min-w-[76px]';
        timeBox.textContent = item.time;

        // アイコンバッジ
        const iconWrapper = document.createElement('div');
        iconWrapper.className = 'w-10 h-10 sm:w-11 sm:h-11 rounded-2xl overflow-hidden shrink-0 flex items-center justify-center bg-white/80 dark:bg-black/30 p-1.5 shadow-sm';
        
        if (item.iconUrl) {
          const img = document.createElement('img');
          img.src = item.iconUrl;
          img.alt = '';
          img.className = 'w-full h-full object-contain';
          img.loading = 'lazy';
          img.onerror = function() {
            this.style.display = 'none';
            iconWrapper.innerHTML = '<span class="material-symbols-rounded text-xl opacity-60">live_tv</span>';
          };
          iconWrapper.appendChild(img);
        } else {
          iconWrapper.innerHTML = '<span class="material-symbols-rounded text-xl opacity-60">live_tv</span>';
        }

        // テキスト情報エリア
        const contentBox = document.createElement('div');
        contentBox.className = 'flex-1 min-w-0';

        // 上段：配信者名 + 注目バッジ
        const metaRow = document.createElement('div');
        metaRow.className = 'flex items-center flex-wrap gap-2 mb-1';

        if (item.streamerName) {
          if (item.streamerUrl) {
            const streamerLink = document.createElement('a');
            streamerLink.href = item.streamerUrl;
            streamerLink.target = '_blank';
            streamerLink.rel = 'noopener noreferrer';
            streamerLink.className = 'text-xs sm:text-sm font-bold truncate max-w-full hover:underline opacity-85 hover:opacity-100 transition-opacity';
            streamerLink.style.color = 'var(--md-sys-color-primary)';
            streamerLink.textContent = item.streamerName;
            streamerLink.addEventListener('click', (e) => e.stopPropagation());
            metaRow.appendChild(streamerLink);
          } else {
            const streamerSpan = document.createElement('span');
            streamerSpan.className = 'text-xs sm:text-sm font-bold truncate opacity-85';
            streamerSpan.style.color = 'var(--md-sys-color-primary)';
            streamerSpan.textContent = item.streamerName;
            metaRow.appendChild(streamerSpan);
          }
        }

        if (item.isHot) {
          const hotBadge = document.createElement('span');
          hotBadge.className = 'hot-badge inline-flex items-center gap-0.5 px-2.5 py-0.5 text-[11px] font-bold';
          hotBadge.innerHTML = '<span class="material-symbols-rounded text-[13px]">local_fire_department</span>注目';
          metaRow.appendChild(hotBadge);
        }

        if (metaRow.children.length > 0) {
          contentBox.appendChild(metaRow);
        }

        // 下段：配信タイトルリンク
        const titleLink = document.createElement('a');
        titleLink.href = item.streamUrl || '#';
        titleLink.target = '_blank';
        titleLink.rel = 'noopener noreferrer';
        titleLink.className = 'block font-bold text-sm sm:text-base md:text-[17px] leading-snug line-clamp-2 hover:underline';
        titleLink.textContent = item.streamTitle;
        contentBox.appendChild(titleLink);

        // 右端：外部リンクアイコン
        const actionIcon = document.createElement('a');
        actionIcon.href = item.streamUrl || '#';
        actionIcon.target = '_blank';
        actionIcon.rel = 'noopener noreferrer';
        actionIcon.className = 'hidden sm:flex w-10 h-10 rounded-full items-center justify-center shrink-0 opacity-60 hover:opacity-100 hover:bg-black/5 dark:hover:bg-white/10 transition-all';
        actionIcon.setAttribute('aria-label', '配信ページを開く');
        actionIcon.innerHTML = '<span class="material-symbols-rounded text-xl">open_in_new</span>';

        article.appendChild(timeBox);
        article.appendChild(iconWrapper);
        article.appendChild(contentBox);
        article.appendChild(actionIcon);

        // カード全体クリックでも配信ページへ遷移
        article.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          if (item.streamUrl) {
            window.open(item.streamUrl, '_blank', 'noopener,noreferrer');
          }
        });

        return article;
      }

      // 点滅を一切起こさないDOM差分レンダリング
      function renderSchedules() {
        if (allSchedules.length === 0) return;

        // フィルタリング適用
        const filtered = allSchedules.filter(item => {
          if (selectedDate !== 'ALL' && item.date !== selectedDate) return false;
          if (onlyHot && !item.isHot) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = item.streamerName.toLowerCase().includes(q);
            const matchTitle = item.streamTitle.toLowerCase().includes(q);
            if (!matchName && !matchTitle) return false;
          }
          return true;
        });

        // 初期ローダーを非表示
        if (initialLoader && !initialLoader.classList.contains('hidden')) {
          initialLoader.classList.add('hidden');
        }

        // 該当なしの場合
        if (filtered.length === 0) {
          scheduleContainer.innerHTML = '';
          emptyState.classList.remove('hidden');
          emptyState.classList.add('flex');
          return;
        } else {
          emptyState.classList.add('hidden');
          emptyState.classList.remove('flex');
        }

        // 日付ごとにグループ化（出現順を維持）
        const groupedByDate = new Map();
        filtered.forEach(item => {
          if (!groupedByDate.has(item.date)) {
            groupedByDate.set(item.date, []);
          }
          groupedByDate.get(item.date).push(item);
        });

        // 現在DOMに存在するセクションとアイテムをマップ化（再利用して点滅防止）
        const existingSections = new Map();
        Array.from(scheduleContainer.children).forEach(sec => {
          const d = sec.getAttribute('data-section-date');
          if (d) existingSections.set(d, sec);
        });

        // 不要になった日付セクションを削除
        existingSections.forEach((sec, d) => {
          if (!groupedByDate.has(d)) {
            sec.remove();
          }
        });

        // 日付セクションごとに差分更新
        let previousSection = null;
        groupedByDate.forEach((items, dateStr) => {
          let section = existingSections.get(dateStr);
          let listGrid;

          if (!section) {
            // 新しい日付セクションを作成
            section = document.createElement('section');
            section.setAttribute('data-section-date', dateStr);
            section.className = 'space-y-3.5';

            const header = document.createElement('div');
            header.className = 'date-sticky-header sticky z-20 py-1 pointer-events-none';
            
            const pill = document.createElement('div');
            pill.className = 'date-pill px-4 py-1.5 shadow-sm pointer-events-auto backdrop-blur-md';
            pill.innerHTML = `
              <span class="material-symbols-rounded text-lg">calendar_today</span>
              <span class="font-display font-extrabold text-base sm:text-lg tracking-wide">${dateStr}</span>
              <span class="count-badge text-xs font-bold px-2 py-0.5 rounded-full bg-black/10 dark:bg-white/15">${items.length}</span>
            `;
            header.appendChild(pill);

            listGrid = document.createElement('div');
            listGrid.className = 'list-grid grid grid-cols-1 gap-3';

            section.appendChild(header);
            section.appendChild(listGrid);

            if (previousSection) {
              previousSection.after(section);
            } else {
              scheduleContainer.prepend(section);
            }
          } else {
            // 既存セクションの件数バッジのみ更新
            const countBadge = section.querySelector('.count-badge');
            if (countBadge && countBadge.textContent !== String(items.length)) {
              countBadge.textContent = String(items.length);
            }
            listGrid = section.querySelector('.list-grid');
          }

          previousSection = section;

          // listGrid内のアイテムをキーで差分同期
          const existingCards = new Map();
          Array.from(listGrid.children).forEach(card => {
            const k = card.getAttribute('data-key');
            if (k) existingCards.set(k, card);
          });

          const newKeys = new Set(items.map(i => i.key));
          existingCards.forEach((card, k) => {
            if (!newKeys.has(k)) {
              card.remove();
            }
          });

          let prevCard = null;
          items.forEach(item => {
            let card = existingCards.get(item.key);
            if (!card) {
              // 新規アイテムのみ登場アニメーション付きで挿入
              card = createScheduleCardElement(item, true);
              if (prevCard) {
                prevCard.after(card);
              } else {
                listGrid.prepend(card);
              }
            } else {
              // 既存アイテムはそのまま維持し、並び順が変わった場合のみ移動（再描画・点滅なし）
              if (prevCard) {
                if (prevCard.nextElementSibling !== card) {
                  prevCard.after(card);
                }
              } else if (listGrid.firstElementChild !== card) {
                listGrid.prepend(card);
              }
            }
            prevCard = card;
          });
        });

        // 追従検索バーの高さに合わせて日付ピルのsticky位置を動的に調整
        updateStickyOffsets();
      }

      // 追従コントロールバーの高さを計測して日付見出しの重なりを防止
      function updateStickyOffsets() {
        if (!stickyControls) return;
        const barHeight = stickyControls.offsetHeight;
        document.querySelectorAll('.date-sticky-header').forEach(header => {
          header.style.top = `${barHeight}px`;
        });
      }

      // Jina ReaderからHTMLを取得して反映（前の完了を待たずに並列リクエスト）
      async function fetchSchedulesNonBlocking() {
        const seq = ++latestSequenceId;
        try {
          const response = await fetch(TARGET_URL, {
            method: 'GET',
            headers: {
              'X-Return-Format': 'html'
            },
            cache: 'no-store'
          });

          if (!response.ok) return;

          const htmlText = await response.text();
          // より新しいリクエストが既に完了している場合は古い結果で上書きしない
          if (seq < latestSequenceId && allSchedules.length > 0) return;

          const extracted = parseScheduleHtml(htmlText);
          if (extracted && extracted.length > 0) {
            allSchedules = extracted;
            const uniqueDates = Array.from(new Set(allSchedules.map(item => item.date)));
            syncDateTabs(uniqueDates);
            renderSchedules();
          }
        } catch (err) {
          // ネットワーク一時エラー時は既存の表示をそのまま維持（点滅やエラー表示は出さない）
        }
      }

      // イベントリスナー設定
      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.trim();
        if (searchQuery) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        renderSchedules();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        renderSchedules();
        searchInput.focus();
      });

      hotFilterBtn.addEventListener('click', () => {
        onlyHot = !onlyHot;
        if (onlyHot) {
          hotFilterBtn.classList.add('active');
        } else {
          hotFilterBtn.classList.remove('active');
        }
        renderSchedules();
      });

      // スクロール位置に応じた追従ヘッダーの影と右下FABの表示制御
      function handleScroll() {
        const scrollY = window.scrollY || document.documentElement.scrollTop;
        
        if (scrollY > 40) {
          stickyControls.classList.add('is-stuck');
        } else {
          stickyControls.classList.remove('is-stuck');
        }

        if (scrollY > 240) {
          scrollTopBtn.classList.remove('is-hidden');
        } else {
          scrollTopBtn.classList.add('is-hidden');
        }
      }

      window.addEventListener('scroll', handleScroll, { passive: true });
      window.addEventListener('resize', updateStickyOffsets, { passive: true });

      // トップへスムーズスクロール
      scrollTopBtn.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });

      // 初回即時取得 ＆ 1秒ごとの非ブロッキング定期更新
      window.addEventListener('DOMContentLoaded', () => {
        updateStickyOffsets();
        handleScroll();
        fetchSchedulesNonBlocking();
        setInterval(fetchSchedulesNonBlocking, 1000);
      });
    })();
  </script>
</body>
</html>
