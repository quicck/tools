<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語辞書</title>
    <style>
        :root {
            --bg-1: #eef2ff;
            --bg-2: #f5f3ff;
            --bg-3: #fdf2f8;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(20px);
            --text-main: #0f172a;
            --text-sub: #475569;
            --input-border: rgba(99, 102, 241, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            background-size: 300% 300%;
            animation: gradientShift 18s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
            background-size: 200% 200%;
            animation: smoothTextGrad 8s ease-in-out infinite alternate;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            width: 100%;
            max-width: 680px;
        }

        .search-field {
            width: 100%;
            padding: 14px 24px;
            font-size: 1.1rem;
            border: 1.5px solid var(--input-border);
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        .search-field:focus {
            background: rgba(255, 255, 255, 0.98);
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 8px 25px -4px rgba(99, 102, 241, 0.22), inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        .container {
            flex: 1;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 16px;
        }

        .entry-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: smoothTextGrad 8s ease-in-out infinite alternate;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            word-break: break-word;
        }

        @keyframes smoothTextGrad {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .entry-count {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .entry-variant {
            font-size: 0.95rem;
            color: var(--text-sub);
            padding-bottom: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .section-block {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 16px;
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            border-radius: 3px;
            margin-right: 10px;
        }

        .item-row {
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            transition: opacity 0.3s ease;
        }

        .item-head {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .item-body {
            font-size: 1rem;
            line-height: 2.1;
            color: var(--text-main);
            word-break: break-word;
        }

        ruby {
            ruby-position: over;
        }

        rt {
            font-size: 0.65em;
            color: var(--text-sub);
            font-weight: normal;
            line-height: 1;
        }

        .wordclass {
            font-weight: 700;
            color: #4f46e5;
            margin-right: 6px;
        }

        ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        li {
            margin-bottom: 8px;
        }

        @media (min-width: 640px) {
            .header {
                padding: 20px 24px;
            }

            .header-title {
                font-size: 1.6rem;
            }

            .search-field {
                padding: 16px 28px;
                font-size: 1.25rem;
            }

            .container {
                padding: 40px 24px;
            }

            .entry-title {
                font-size: 3rem;
            }

            .item-body {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">英語辞書</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-field" autofocus spellcheck="false" autocomplete="off">
        </div>
    </header>

    <main class="container" id="container"></main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const container = document.getElementById('container');

        let lastFetchedHtml = '';
        let lastQuery = '';

        function updateData() {
            const query = searchInput.value.trim();

            if (!query) {
                if (lastQuery !== '') {
                    container.innerHTML = '';
                    lastQuery = '';
                    lastFetchedHtml = '';
                }
                return;
            }

            lastQuery = query;

            const targetUrl = `https://eow.alc.co.jp/search?q=${encodeURIComponent(query)}`;
            const proxyUrl = `https://proxy.cors.sh/${targetUrl}`;

            fetch(proxyUrl)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(html => {
                    if (searchInput.value.trim() === query && html !== lastFetchedHtml) {
                        lastFetchedHtml = html;
                        renderContent(html, query);
                    }
                })
                .catch(() => {});
        }

        function convertToRuby(htmlString) {
            const regex = /([\u4E00-\u9FFF]+)<span[^>]*class=["']kana["'][^>]*>[\s\n]*[｛\{](.*?)[｝\}][\s\n]*<\/span>/g;
            return htmlString.replace(regex, (match, kanji, furigana) => {
                return `<ruby>${kanji}<rt>${furigana.trim()}</rt></ruby>`;
            });
        }

        function renderContent(htmlText, query) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            const resultsArea = doc.getElementById('resultsArea');

            if (!resultsArea) {
                container.innerHTML = '';
                return;
            }

            let countText = '';
            const table = resultsArea.querySelector('.search-word-table');
            if (table) {
                const td = table.querySelector('td');
                if (td) countText = td.textContent.replace(/検索結果一覧を見る.*/g, '').trim();
            }

            let variantText = '';
            const variantTr = resultsArea.querySelector('tr.variant');
            if (variantTr) variantText = variantTr.textContent.replace(/\s+/g, ' ').trim();

            let mainHtml = '';
            const useList = resultsArea.querySelector('.search-use-list');
            if (useList) {
                const items = useList.querySelectorAll('li.result-item');
                items.forEach(item => {
                    const tango = item.querySelector('.tango');
                    if (tango) tango.remove();
                    const midashi = item.querySelector('.midashi');
                    if (midashi) midashi.remove();

                    const formattedBody = convertToRuby(item.innerHTML);
                    mainHtml += `<div class="item-row"><div class="item-body">${formattedBody}</div></div>`;
                });
            }

            let phraseHtml = '';
            let sectionTitleText = '';
            const sentenceList = resultsArea.querySelector('.search-sentence-list');
            if (sentenceList) {
                const sentenceTtl = resultsArea.querySelector('#search-sentence-ttl');
                if (sentenceTtl) sectionTitleText = sentenceTtl.textContent.replace(/\s+/g, ' ').trim();

                const items = sentenceList.querySelectorAll('li.result-item');
                items.forEach(item => {
                    const midashi = item.querySelector('.midashi');
                    const headText = midashi ? midashi.textContent.trim() : '';

                    const tango = item.querySelector('.tango');
                    if (tango) tango.remove();
                    if (midashi) midashi.remove();

                    const formattedBody = convertToRuby(item.innerHTML.trim());

                    phraseHtml += `
                        <div class="item-row">
                            ${headText ? `<div class="item-head">${escapeHtml(headText)}</div>` : ''}
                            <div class="item-body">${formattedBody}</div>
                        </div>
                    `;
                });
            }

            container.innerHTML = `
                <div class="entry-title">${escapeHtml(query)}</div>
                ${countText ? `<div class="entry-count">${escapeHtml(countText)}</div>` : ''}
                ${variantText ? `<div class="entry-variant">${escapeHtml(variantText)}</div>` : ''}
                
                ${mainHtml ? `<div class="section-block">${mainHtml}</div>` : ''}
                
                ${phraseHtml ? `
                    <div class="section-block">
                        ${sectionTitleText ? `<div class="section-title">${escapeHtml(sectionTitleText)}</div>` : ''}
                        ${phraseHtml}
                    </div>
                ` : ''}
            `;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        setInterval(updateData, 1000);
    </script>
</body>
</html>
