<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語辞書</title>
    <style>
        :root {
            --bg-1: #eef2ff;
            --bg-2: #f5f3ff;
            --bg-3: #fdf2f8;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(20px);
            --text-main: #0f172a;
            --text-sub: #475569;
            --input-border: rgba(99, 102, 241, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
            background-size: 300% 300%;
            animation: gradientShift 18s ease infinite;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.05em;
            background: linear-gradient(135deg, #4f46e5, #9333ea, #ec4899);
            background-size: 200% 200%;
            animation: smoothTextGrad 8s ease-in-out infinite alternate;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container {
            width: 100%;
            max-width: 1200px;
        }

        .search-field {
            width: 100%;
            padding: 14px 24px;
            font-size: 1.1rem;
            border: 1.5px solid var(--input-border);
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            color: var(--text-main);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06), inset 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        .search-field:focus {
            background: rgba(255, 255, 255, 0.98);
            border-color: rgba(99, 102, 241, 0.6);
            box-shadow: 0 8px 25px -4px rgba(99, 102, 241, 0.22), inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        .container {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px;
        }

        .entry-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: smoothTextGrad 8s ease-in-out infinite alternate;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            word-break: break-word;
        }

        @keyframes smoothTextGrad {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .entry-count {
            font-size: 0.95rem;
            color: var(--text-sub);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .entry-variant {
            font-size: 0.95rem;
            color: var(--text-sub);
            padding-bottom: 20px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--glass-border);
        }

        .section-block {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .section-title::before {
            content: "";
            display: inline-block;
            width: 5px;
            height: 16px;
            background: linear-gradient(135deg, #4f46e5, #ec4899);
            border-radius: 3px;
            margin-right: 10px;
        }

        .item-row {
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            transition: opacity 0.3s ease;
        }

        .item-head {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .item-body {
            font-size: 1rem;
            line-height: 2.1;
            color: var(--text-main);
            word-break: break-word;
        }

        ruby {
            ruby-position: over;
        }

        rt {
            font-size: 0.65em;
            color: var(--text-sub);
            font-weight: normal;
            line-height: 1;
        }

        .wordclass {
            font-weight: 700;
            color: #4f46e5;
            margin-right: 6px;
        }

        ol {
            padding-left: 20px;
            margin: 8px 0;
        }

        li {
            margin-bottom: 8px;
        }

        @media (min-width: 640px) {
            .header {
                padding: 20px 40px;
            }

            .header-title {
                font-size: 1.6rem;
            }

            .search-field {
                padding: 16px 32px;
                font-size: 1.25rem;
            }

            .container {
                padding: 40px 48px;
            }

            .entry-title {
                font-size: 3.2rem;
            }

            .item-body {
                font-size: 1.15rem;
            }
        }

        @media (min-width: 1280px) {
            .header {
                padding: 24px 64px;
            }

            .container {
                padding: 48px 80px;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-title">英語辞書</div>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-field" autofocus spellcheck="false" autocomplete="off">
        </div>
    </header>

    <main class="container" id="container"></main>

    <script>
        const searchInput = document.getElementById('searchInput');
        const container = document.getElementById('container');

        let currentSearchSession = 0;
        let lastQuery = '';
        let loadedPages = new Set();
        let maxPages = 1;
        let isFetchingNext = false;
        let shouldResetScroll = false;

        searchInput.addEventListener('input', () => {
            shouldResetScroll = true;
        });

        function updateData() {
            const query = searchInput.value.trim();

            if (!query) {
                if (lastQuery !== '') {
                    container.innerHTML = '';
                    lastQuery = '';
                    loadedPages.clear();
                    currentSearchSession++;
                }
                return;
            }

            // クエリが変わった場合は新しい検索セッションを開始
            if (query !== lastQuery) {
                lastQuery = query;
                currentSearchSession++;
                loadedPages.clear();
                maxPages = 1;
                isFetchingNext = false;
                fetchFirstPage(query, currentSearchSession);
            }
        }

        // 1ページ目の取得とメイン表示の構築
        function fetchFirstPage(query, sessionId) {
            const targetUrl = `https://eow.alc.co.jp/search?q=${encodeURIComponent(query)}&pg=1`;
            const proxyUrl = `https://proxy.cors.sh/${targetUrl}`;

            fetch(proxyUrl)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(html => {
                    if (sessionId !== currentSearchSession) return;

                    loadedPages.add(1);
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const resultsArea = doc.getElementById('resultsArea');

                    if (!resultsArea) {
                        container.innerHTML = '';
                        return;
                    }

                    // 最大ページ数の検出
                    maxPages = extractMaxPages(doc);

                    // 件数
                    let countText = '';
                    const table = resultsArea.querySelector('.search-word-table');
                    if (table) {
                        const td = table.querySelector('td');
                        if (td) countText = td.textContent.replace(/検索結果一覧を見る.*/g, '').trim();
                    }

                    // 変化形
                    let variantText = '';
                    const variantTr = resultsArea.querySelector('tr.variant');
                    if (variantTr) variantText = variantTr.textContent.replace(/\s+/g, ' ').trim();

                    // メインの意味
                    let mainHtml = '';
                    const useList = resultsArea.querySelector('.search-use-list');
                    if (useList) {
                        const items = useList.querySelectorAll('li.result-item');
                        items.forEach(item => {
                            const tango = item.querySelector('.tango');
                            if (tango) tango.remove();
                            const midashi = item.querySelector('.midashi');
                            if (midashi) midashi.remove();

                            const formattedBody = formatResultContent(item.innerHTML);
                            mainHtml += `<div class="item-row"><div class="item-body">${formattedBody}</div></div>`;
                        });
                    }

                    // 例文・フレーズ一覧 (1ページ目)
                    let phraseHtml = '';
                    let sectionTitleText = '';
                    const sentenceList = resultsArea.querySelector('.search-sentence-list');
                    if (sentenceList) {
                        const sentenceTtl = resultsArea.querySelector('#search-sentence-ttl');
                        if (sentenceTtl) sectionTitleText = sentenceTtl.textContent.replace(/\s+/g, ' ').trim();

                        const items = sentenceList.querySelectorAll('li.result-item');
                        items.forEach(item => {
                            phraseHtml += createPhraseItemHtml(item);
                        });
                    }

                    if (shouldResetScroll) {
                        window.scrollTo(0, 0);
                        shouldResetScroll = false;
                    }

                    container.innerHTML = `
                        <div class="entry-title">${escapeHtml(query)}</div>
                        ${countText ? `<div class="entry-count">${escapeHtml(countText)}</div>` : ''}
                        ${variantText ? `<div class="entry-variant">${escapeHtml(variantText)}</div>` : ''}
                        
                        ${mainHtml ? `<div class="section-block">${mainHtml}</div>` : ''}
                        
                        <div class="section-block" id="phraseSection" ${!phraseHtml ? 'style="display:none;"' : ''}>
                            ${sectionTitleText ? `<div class="section-title">${escapeHtml(sectionTitleText)}</div>` : ''}
                            <div id="phraseListContainer">${phraseHtml}</div>
                        </div>
                    `;

                    // 2ページ目以降の全自動バックグラウンド取得を開始
                    triggerBackgroundFetch(query, sessionId, 2);
                })
                .catch(() => {});
        }

        // バックグラウンドで順次次のページを取得して末尾に追加
        function triggerBackgroundFetch(query, sessionId, page) {
            if (page > maxPages || sessionId !== currentSearchSession || loadedPages.has(page) || isFetchingNext) {
                return;
            }

            isFetchingNext = true;
            const targetUrl = `https://eow.alc.co.jp/search?q=${encodeURIComponent(query)}&pg=${page}`;
            const proxyUrl = `https://proxy.cors.sh/${targetUrl}`;

            fetch(proxyUrl)
                .then(res => {
                    if (!res.ok) throw new Error();
                    return res.text();
                })
                .then(html => {
                    isFetchingNext = false;
                    if (sessionId !== currentSearchSession) return;

                    loadedPages.add(page);
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const sentenceList = doc.querySelector('.search-sentence-list');
                    
                    if (sentenceList) {
                        const items = sentenceList.querySelectorAll('li.result-item');
                        const phraseListContainer = document.getElementById('phraseListContainer');
                        const phraseSection = document.getElementById('phraseSection');

                        if (phraseListContainer && items.length > 0) {
                            if (phraseSection) phraseSection.style.display = 'block';

                            let appendedHtml = '';
                            items.forEach(item => {
                                appendedHtml += createPhraseItemHtml(item);
                            });

                            phraseListContainer.insertAdjacentHTML('beforeend', appendedHtml);
                        }
                    }

                    // 次のページを即座に連鎖読み込み
                    if (page + 1 <= maxPages) {
                        setTimeout(() => {
                            triggerBackgroundFetch(query, sessionId, page + 1);
                        }, 200); // サーバー負荷軽減とスムーズな処理のためわずかなディレイ
                    }
                })
                .catch(() => {
                    isFetchingNext = false;
                });
        }

        // 例文項目の単一HTML生成
        function createPhraseItemHtml(item) {
            const midashi = item.querySelector('.midashi');
            const headText = midashi ? midashi.textContent.trim() : '';

            const tango = item.querySelector('.tango');
            if (tango) tango.remove();
            if (midashi) midashi.remove();

            const formattedBody = formatResultContent(item.innerHTML.trim());

            return `
                <div class="item-row">
                    ${headText ? `<div class="item-head">${escapeHtml(headText)}</div>` : ''}
                    <div class="item-body">${formattedBody}</div>
                </div>
            `;
        }

        // HTMLから最大ページ数を特定
        function extractMaxPages(doc) {
            let max = 1;
            const pageLinks = doc.querySelectorAll('#paging .page-num a, #inner_paging .page-num a');
            pageLinks.forEach(link => {
                const num = parseInt(link.textContent.trim(), 10);
                if (!isNaN(num) && num > max) {
                    max = num;
                }
            });
            return max;
        }

        function convertToRuby(htmlString) {
            const regex = /([\u4E00-\u9FFF]+)<span[^>]*class=["']kana["'][^>]*>[\s\n]*[｛\{](.*?)[｝\}][\s\n]*<\/span>/g;
            return htmlString.replace(regex, (match, kanji, furigana) => {
                return `<ruby>${kanji}<rt>${furigana.trim()}</rt></ruby>`;
            });
        }

        function formatResultContent(rawHtml) {
            let processed = convertToRuby(rawHtml);
            processed = processed.replace(/【＠】|【@】/g, '【カナ】');
            return processed;
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        setInterval(updateData, 1000);
    </script>
</body>
</html>
