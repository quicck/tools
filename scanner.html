<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            color: #0f172a;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Ambient Glow Layer */
        .ambient-glow {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), transparent 70%);
            mix-blend-mode: overlay;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { opacity: 0.3; transform: scale(0.98); }
            100% { opacity: 0.8; transform: scale(1.02); }
        }

        /* Scan Target Indicator */
        .scan-overlay {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reticle {
            width: min(65vw, 240px);
            height: min(65vw, 240px);
            position: relative;
            background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            animation: breathe 4s ease-in-out infinite;
        }

        .reticle::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.1), rgba(255,255,255,0.6));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateGlow 6s linear infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Settings Icon Button */
        .settings-btn {
            position: absolute;
            top: calc(20px + env(safe-area-inset-top));
            right: 20px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .settings-btn:active {
            transform: scale(0.92);
        }

        .settings-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #0f172a;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Result Bottom Glass Panel */
        .glass-result {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(140%);
            width: calc(100% - 40px);
            max-width: 420px;
            padding: 20px 24px;
            z-index: 10;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.15),
                inset 0 1px 1px rgba(255, 255, 255, 0.8),
                inset 0 -1px 1px rgba(255, 255, 255, 0.3);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .glass-result.active {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .result-text {
            font-size: 15px;
            font-weight: 500;
            color: #0f172a;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            line-height: 1.4;
            user-select: text;
        }

        .result-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.9);
        }

        .action-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.9);
        }

        /* Settings Overlay Window */
        .modal-overlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(35px) saturate(210%);
            -webkit-backdrop-filter: blur(35px) saturate(210%);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
            overflow-y: auto;
        }

        .modal-overlay.active {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.05);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.8);
            font-size: 15px;
            font-weight: 500;
        }

        .setting-btn-item {
            padding: 16px;
            background: rgba(255, 255, 255, 0.5);
            border: none;
            border-radius: 20px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            cursor: pointer;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.8);
            transition: background 0.2s;
        }

        .setting-btn-item:active {
            background: rgba(255, 255, 255, 0.8);
        }

        .setting-btn-item.danger {
            color: #e11d48;
        }

        /* Toggle Switch Styling */
        .switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.15);
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input:checked + .slider {
            background-color: #0f172a;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* History Modal Overlay */
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 18px;
            gap: 12px;
        }

        .history-text {
            font-size: 14px;
            font-weight: 500;
            word-break: break-all;
            flex: 1;
            user-select: text;
        }

        .history-del-btn {
            border: none;
            background: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
        }

        /* Toast Indicator */
        .copy-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 50;
        }

        .copy-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        canvas {
            display: none;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="ambient-glow"></div>

    <!-- Scan Focus Ring -->
    <div class="scan-overlay">
        <div class="reticle"></div>
    </div>

    <!-- Right Top Settings Trigger -->
    <button class="settings-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
    </button>

    <!-- Bottom Result Card -->
    <div id="resultSheet" class="glass-result">
        <div id="resultText" class="result-text"></div>
        <div class="result-actions">
            <button id="copyBtn" class="action-btn">コピー</button>
            <button id="openLinkBtn" class="action-btn" style="display: none;">開く</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="copy-toast"></div>

    <!-- Settings Overlay -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal-header">
            <div style="font-weight: 700; font-size: 18px;"></div>
            <button class="close-btn" id="closeSettingsBtn">✕</button>
        </div>
        <div class="settings-list">
            <div class="setting-item">
                <span>URL自動遷移</span>
                <label class="switch">
                    <input type="checkbox" id="autoRedirectToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
            
            <button class="setting-btn-item" id="switchCameraBtn">カメラ切替</button>

            <div class="setting-item">
                <span>履歴保持</span>
                <label class="switch">
                    <input type="checkbox" id="historyToggle">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="setting-btn-item" id="showHistoryBtn" style="display: none;">履歴を表示</button>
            <button class="setting-btn-item danger" id="clearHistoryBtn" style="display: none;">履歴を全削除</button>
        </div>
    </div>

    <!-- History Overlay -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-header">
            <div style="font-weight: 700; font-size: 18px;"></div>
            <button class="close-btn" id="closeHistoryBtn">✕</button>
        </div>
        <div id="historyList" class="history-list"></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const resultSheet = document.getElementById('resultSheet');
        const resultText = document.getElementById('resultText');
        const copyBtn = document.getElementById('copyBtn');
        const openLinkBtn = document.getElementById('openLinkBtn');
        const toast = document.getElementById('toast');

        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');

        const historyModal = document.getElementById('historyModal');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const showHistoryBtn = document.getElementById('showHistoryBtn');
        const historyList = document.getElementById('historyList');

        const autoRedirectToggle = document.getElementById('autoRedirectToggle');
        const historyToggle = document.getElementById('historyToggle');
        const switchCameraBtn = document.getElementById('switchCameraBtn');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        let isProcessing = false;
        let lastScannedContent = '';
        let scanTimeout = null;
        let currentStream = null;
        let currentFacingMode = 'environment'; // 'environment' or 'user'

        // Local Storage Config Keys
        const CONFIG_AUTO_REDIRECT = 'scanner_auto_redirect';
        const CONFIG_HISTORY_ENABLE = 'scanner_history_enable';
        const STORAGE_HISTORY = 'scanner_history_data';

        // Load Settings
        let autoRedirect = localStorage.getItem(CONFIG_AUTO_REDIRECT) !== 'false';
        let historyEnabled = localStorage.getItem(CONFIG_HISTORY_ENABLE) === 'true';

        autoRedirectToggle.checked = autoRedirect;
        historyToggle.checked = historyEnabled;

        updateHistoryUIState();

        // Initialize Camera
        async function startCamera(facingMode = 'environment') {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { exact: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                }).catch(async () => {
                    // Fallback without 'exact' if switching failed
                    return await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode },
                        audio: false
                    });
                });

                currentStream = stream;
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                video.play();
                requestAnimationFrame(tick);
            } catch (err) {
                showToastMessage('カメラ起動エラー');
            }
        }

        // Camera Switch Toggle
        switchCameraBtn.addEventListener('click', async () => {
            const newMode = currentFacingMode === 'environment' ? 'user' : 'environment';
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoInputs = devices.filter(device => device.kind === 'videoinput');
                
                if (videoInputs.length < 2) {
                    showToastMessage('カメラ切替非対応');
                    return;
                }

                currentFacingMode = newMode;
                await startCamera(currentFacingMode);
                showToastMessage('カメラ切替');
            } catch (e) {
                showToastMessage('カメラ切替失敗');
            }
        });

        // Settings Toggles
        autoRedirectToggle.addEventListener('change', (e) => {
            autoRedirect = e.target.checked;
            localStorage.setItem(CONFIG_AUTO_REDIRECT, autoRedirect);
        });

        historyToggle.addEventListener('change', (e) => {
            historyEnabled = e.target.checked;
            localStorage.setItem(CONFIG_HISTORY_ENABLE, historyEnabled);
            updateHistoryUIState();
        });

        function updateHistoryUIState() {
            showHistoryBtn.style.display = historyEnabled ? 'block' : 'none';
            clearHistoryBtn.style.display = historyEnabled ? 'block' : 'none';
        }

        // Fullscreen Toggle on Body Click
        document.addEventListener('click', (e) => {
            if (
                settingsModal.contains(e.target) || 
                historyModal.contains(e.target) || 
                settingsBtn.contains(e.target) || 
                resultSheet.contains(e.target)
            ) {
                return;
            }

            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        // Settings Windows Controls
        settingsBtn.addEventListener('click', () => settingsModal.classList.add('active'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.remove('active'));

        showHistoryBtn.addEventListener('click', () => {
            renderHistory();
            historyModal.classList.add('active');
        });
        closeHistoryBtn.addEventListener('click', () => historyModal.classList.remove('active'));

        clearHistoryBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_HISTORY);
            renderHistory();
            showToastMessage('履歴を消去');
        });

        // Copy Actions
        copyBtn.addEventListener('click', () => {
            copyToClipboard(resultText.innerText);
        });

        openLinkBtn.addEventListener('click', () => {
            const url = resultText.innerText;
            if (isValidUrl(url)) {
                window.location.href = url;
            }
        });

        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showToastMessage('コピー完了');
            } catch (err) {
                // Fail silent
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function showToastMessage(msg) {
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 1400);
        }

        // Main Loop
        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Scan QR
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code && code.data) {
                    handleDetection(code.data);
                }

                // Native Barcode Detector
                if ('BarcodeDetector' in window && !isProcessing) {
                    try {
                        const barcodeDetector = new BarcodeDetector();
                        barcodeDetector.detect(canvas)
                            .then(barcodes => {
                                if (barcodes.length > 0) {
                                    handleDetection(barcodes[0].rawValue);
                                }
                            })
                            .catch(() => {});
                    } catch(e) {}
                }
            }
            requestAnimationFrame(tick);
        }

        function handleDetection(content) {
            if (isProcessing) return;

            // Direct Jump if URL & Auto Redirect enabled
            if (isValidUrl(content) && autoRedirect) {
                isProcessing = true;
                saveHistory(content);
                window.location.href = content;
                return;
            }

            // Display Content
            if (content !== lastScannedContent) {
                isProcessing = true;
                lastScannedContent = content;

                saveHistory(content);

                resultText.innerText = content;
                
                if (isValidUrl(content)) {
                    openLinkBtn.style.display = 'block';
                } else {
                    openLinkBtn.style.display = 'none';
                }

                resultSheet.classList.add('active');

                clearTimeout(scanTimeout);
                scanTimeout = setTimeout(() => {
                    resultSheet.classList.remove('active');
                    setTimeout(() => {
                        isProcessing = false;
                        lastScannedContent = '';
                    }, 500);
                }, 8000);
            }
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        // History Data Management
        function saveHistory(text) {
            if (!historyEnabled) return;

            let history = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
            // Avoid exact duplicate at top
            if (history.length > 0 && history[0] === text) return;

            history.unshift(text);
            if (history.length > 100) history.pop(); // Limit 100
            localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
            historyList.innerHTML = '';

            if (history.length === 0) {
                historyList.innerHTML = '<div style="text-align:center; padding: 20px; color: #64748b; font-size:14px;">なし</div>';
                return;
            }

            history.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'history-text';
                textSpan.innerText = item;

                const delBtn = document.createElement('button');
                delBtn.className = 'history-del-btn';
                delBtn.innerText = '✕';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteHistoryItem(index);
                });

                div.appendChild(textSpan);
                div.appendChild(delBtn);

                div.addEventListener('click', () => {
                    copyToClipboard(item);
                });

                historyList.appendChild(div);
            });
        }

        function deleteHistoryItem(index) {
            let history = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
            history.splice(index, 1);
            localStorage.setItem(STORAGE_HISTORY, JSON.stringify(history));
            renderHistory();
        }

        window.addEventListener('load', () => startCamera(currentFacingMode));
    </script>
</body>
</html>
